name: Docs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One docs run per ref. Pushes to main therefore queue and complete in order, so an older
# build can never finish after — and overwrite — a newer one; they are never cancelled.
# PR runs are grouped per branch and a superseded PR run is cancelled, since only the tip
# of a pull request is worth building.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: "Build docs (TypeDoc warnings are errors) and check internal links"
        run: npm run docs:check
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-dist

  deploy:
    # Only main deploys, including manual dispatches: a dispatch from another branch builds but does not publish.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    # The deploy job also serialises on the Pages environment, which is shared with any
    # other workflow that publishes Pages; the ref-level group above orders main's own runs.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
