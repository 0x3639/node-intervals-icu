name: Spec drift

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: spec-drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: drift
        run: |
          set +e
          node scripts/check-spec-drift.mjs
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Open or update drift issue
        if: steps.drift.outputs.code == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const { upsertDriftIssue } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/lib/drift-issue.mjs`);
            const body = require('fs').readFileSync('drift.md', 'utf8');
            const result = await upsertDriftIssue({ github, owner: context.repo.owner, repo: context.repo.repo, label: 'spec-drift', title: `Intervals.icu API spec drift detected (${new Date().toISOString().slice(0, 10)})`, body });
            core.info(`${result.action} #${result.number}`);
      - name: Fail job on drift
        if: steps.drift.outputs.code != '0'
        run: exit 1
